# Home Assistant ingress
#
# Serves the web interface in the Home Assistant sidebar. The Supervisor
# proxies /api/hassio_ingress/<token>/ to this port with that prefix stripped,
# and passes the prefix along in the X-Ingress-Path header. It is written into
# index.html, where the interface reads it to build its API calls and links.
server {
	listen 8099;

	# Only the Supervisor may connect
	allow 172.30.32.2;
	deny all;

	root /opt/nginx-proxy-manager/frontend;
	access_log /dev/null;

	location ^~ /api/ {
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Scheme $scheme;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_pass http://127.0.0.1:3000/;

		proxy_read_timeout 15m;
		proxy_send_timeout 15m;
	}

	# The interface loads its files relative to the page, so a page opened at
	# a nested route asks for e.g. /nginx/assets/index.js
	location ~ ^/.+?/((?:assets|images)/.+)$ {
		try_files /$1 =404;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}

	location = /index.html {
		# The ingress path is per install, so never let a cached copy go stale
		add_header Cache-Control "no-store";

		sub_filter '<meta name="ingress-path" content="" />' '<meta name="ingress-path" content="$http_x_ingress_path" />';
		sub_filter_once on;
	}
}
